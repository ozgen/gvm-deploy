suite: gsa-lite deployment
templates:
  - templates/gsa-lite-deploy.yaml

tests:
  - it: renders Deployment named gsa-lite with app label
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: gsa-lite
      - equal:
          path: metadata.labels.app
          value: gsa-lite

  - it: selector and pod labels match app=gsa-lite
    asserts:
      - equal:
          path: spec.selector.matchLabels.app
          value: gsa-lite
      - equal:
          path: spec.template.metadata.labels.app
          value: gsa-lite

  - it: uses defaults when values are empty
    set:
      gsaLite:
        replicas: null
        image:
          repository: ""
          tag: ""
          pullPolicy: ""
        configMapName: ""
        containerPort: null
        resources: null
        readiness:
          path: ""
          initialDelaySeconds: null
          periodSeconds: null
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: web
      - equal:
          path: spec.template.spec.containers[0].image
          value: "gsa-lite:prod"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: gsa-lite-config
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80

      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/healthz"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10

      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 128Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: uses provided values (non-default)
    set:
      gsaLite:
        replicas: 2
        image:
          repository: "ghcr.io/acme/gsa-lite"
          tag: "1.2.3"
          pullPolicy: "Always"
        configMapName: "custom-gsa-config"
        containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readiness:
          path: "/ready"
          initialDelaySeconds: 3
          periodSeconds: 7
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/acme/gsa-lite:1.2.3"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: custom-gsa-config
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080

      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/ready"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 7

      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi
