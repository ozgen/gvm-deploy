suite: gsa-lite service
templates:
  - templates/gsa-lite-svc.yaml

tests:
  - it: renders Service named gsa-lite with correct labels and selector
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: gsa-lite
      - equal:
          path: metadata.labels.app
          value: gsa-lite
      - equal:
          path: spec.selector.app
          value: gsa-lite

  - it: renders service port mapping (http to targetPort http)
    set:
      gsaLite:
        service:
          type: ClusterIP
          port: 80
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
      - notExists:
          path: spec.ports[0].nodePort

  - it: includes nodePort only when type is NodePort and nodePort is set
    set:
      gsaLite:
        service:
          type: NodePort
          port: 80
          nodePort: 30080
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].nodePort
          value: 30080

  - it: does NOT include nodePort when type is NodePort but nodePort is empty
    set:
      gsaLite:
        service:
          type: NodePort
          port: 80
          nodePort: null
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - notExists:
          path: spec.ports[0].nodePort
