suite: gvmd-lite secrets
templates:
  - templates/gvmd-lite-secret.yaml
tests:
  - it: renders an Opaque Secret with the expected name suffix
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: type
          value: Opaque
      - matchRegex:
          path: metadata.name
          pattern: ".*-gvmd-secrets$"
  - it: includes required base secrets when set
    set:
      gvmdLite:
        secrets:
          ADMIN_PASSWORD: "adminpw"
          JWT_SECRET: "jwtsecret"
          CREDENTIAL_ENCRYPTION_KEY: "credkey"
    asserts:
      - equal:
          path: stringData.ADMIN_PASSWORD
          value: "adminpw"
      - equal:
          path: stringData.JWT_SECRET
          value: "jwtsecret"
      - equal:
          path: stringData.CREDENTIAL_ENCRYPTION_KEY
          value: "credkey"
  - it: includes optional notification secrets when provided
    set:
      gvmdLite:
        secrets:
          ADMIN_PASSWORD: "adminpw"
          JWT_SECRET: "jwtsecret"
          CREDENTIAL_ENCRYPTION_KEY: "credkey"
          SMTP_USERNAME: "smtp-user"
          SMTP_PASSWORD: "smtp-pass"
          SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/T000/B000/XXX"
          AZURE_CONTAINER_ACCESS_KEY: "azure-key"
    asserts:
      - equal:
          path: stringData.SMTP_USERNAME
          value: "smtp-user"
      - equal:
          path: stringData.SMTP_PASSWORD
          value: "smtp-pass"
      - equal:
          path: stringData.SLACK_WEBHOOK_URL
          value: "https://hooks.slack.com/services/T000/B000/XXX"
      - equal:
          path: stringData.AZURE_CONTAINER_ACCESS_KEY
          value: "azure-key"
  - it: does NOT include optional notification keys when not set
    set:
      gvmdLite:
        secrets:
          ADMIN_PASSWORD: "adminpw"
          JWT_SECRET: "jwtsecret"
          CREDENTIAL_ENCRYPTION_KEY: "credkey"
    asserts:
      - notExists:
          path: stringData.SMTP_USERNAME
      - notExists:
          path: stringData.SMTP_PASSWORD
      - notExists:
          path: stringData.SLACK_WEBHOOK_URL
      - notExists:
          path: stringData.AZURE_CONTAINER_ACCESS_KEY
