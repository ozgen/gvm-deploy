suite: gvmr-lite deployment
templates:
  - templates/gvmr-lite-deploy.yaml
tests:
  - it: does not render anything when gvmrLite is disabled
    set:
      gvmrLite:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders Deployment when gvmrLite is enabled
    set:
      gvmrLite:
        enabled: true
        image:
          repository: "ghcr.io/acme/gvmr-lite"
          tag: "1.0.0"
          pullPolicy: IfNotPresent
        env:
          GVMR_PORT: "8084"
          GVMR_REPORT_FORMATS_FEED_DIR: "/var/lib/gvm"
          GVMR_WORK_DIR: "/tmp/gvmr-lite/work"
          GVMR_REBUILD_ON_START: "1"
          GVMR_AUTH_MODE: "jwt"
        service:
          port: 8084
        resources: {}
        readiness:
          path: "/healthz"
          initialDelaySeconds: 1
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        liveness:
          path: "/healthz"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        pvc:
          work:
            enabled: false
      gvmdLite:
        gvmr:
          jwt:
            audience: "gvmr-lite"
            issuer: "gvmd-lite"
      feed:
        pvc:
          reportFormats:
            name: "gvm-gvm-pvc"
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: gvmr-lite
      - equal:
          path: spec.selector.matchLabels.app
          value: gvmr-lite
      - equal:
          path: spec.template.metadata.labels.app
          value: gvmr-lite
      # security context
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 999
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch
      # initContainer
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: prep-work
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: busybox:1.36
      # main container image and port
      - equal:
          path: spec.template.spec.containers[0].name
          value: gvmr-lite
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/acme/gvmr-lite:1.0.0"
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8084
      # jwt env and secret ref
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GVMR_JWT_AUDIENCE
            value: "gvmr-lite"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GVMR_JWT_ISSUER
            value: "gvmd-lite"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GVMR_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: gvmr-jwt
                key: GVMR_JWT_SHARED_SECRET
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GVMR_EXPERIMENTAL_ENABLED
            value: "true"
      # volumes: report-formats always pvc, work emptyDir when pvc disabled
      - contains:
          path: spec.template.spec.volumes
          content:
            name: report-formats
            persistentVolumeClaim:
              claimName: gvm-gvm-pvc
      - contains:
          path: spec.template.spec.volumes
          content:
            name: work
            emptyDir: {}
  - it: uses PVC for work volume when enabled
    set:
      gvmrLite:
        enabled: true
        image:
          repository: "ghcr.io/acme/gvmr-lite"
          tag: "1.0.0"
          pullPolicy: IfNotPresent
        env:
          GVMR_PORT: "8084"
          GVMR_REPORT_FORMATS_FEED_DIR: "/var/lib/gvm"
          GVMR_WORK_DIR: "/tmp/gvmr-lite/work"
          GVMR_REBUILD_ON_START: "1"
          GVMR_AUTH_MODE: "jwt"
        service:
          port: 8084
        resources: {}
        readiness:
          path: "/healthz"
          initialDelaySeconds: 1
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        liveness:
          path: "/healthz"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        pvc:
          work:
            enabled: true
            name: "gvmr-work-pvc"
      gvmdLite:
        gvmr:
          jwt:
            audience: "gvmr-lite"
            issuer: "gvmd-lite"
      feed:
        pvc:
          reportFormats:
            name: "gvm-report-formats-pvc"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: work
            persistentVolumeClaim:
              claimName: gvmr-work-pvc
