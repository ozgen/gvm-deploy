suite: gvmr jwt secret
templates:
  - templates/gvmr-lite-secret.yaml

tests:
  - it: does not render when gvmrLite is disabled
    set:
      gvmrLite:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Secret gvmr-jwt with shared secret when enabled
    set:
      gvmrLite:
        enabled: true
        jwt:
          sharedSecret: "super-secret"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: gvmr-jwt
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData.GVMR_JWT_SHARED_SECRET
          value: "super-secret"
