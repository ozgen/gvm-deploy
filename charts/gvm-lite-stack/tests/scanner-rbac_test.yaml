suite: scanner rbac
templates:
  - templates/scanner-rbac.yaml
tests:
  - it: renders ServiceAccount + Role + RoleBinding
    set:
      scanner:
        saName: openvas-sa
    asserts:
      - hasDocuments:
          count: 3
      # --- ServiceAccount (doc 0) ---
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: openvas-sa
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: true
        documentIndex: 0
      # --- Role (doc 1) ---
      - isKind:
          of: Role
        documentIndex: 1
      - equal:
          path: metadata.name
          value: openvas-discovery
        documentIndex: 1
      - equal:
          path: rules[0].apiGroups[0]
          value: ""
        documentIndex: 1
      - equal:
          path: rules[0].resources
          value:
            - pods
            - endpoints
            - services
        documentIndex: 1
      - equal:
          path: rules[0].verbs
          value:
            - get
            - list
            - watch
        documentIndex: 1
      # --- RoleBinding (doc 2) ---
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - equal:
          path: metadata.name
          value: openvas-discovery
        documentIndex: 2
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentIndex: 2
      - equal:
          path: subjects[0].name
          value: openvas-sa
        documentIndex: 2
      - equal:
          path: roleRef.kind
          value: Role
        documentIndex: 2
      - equal:
          path: roleRef.name
          value: openvas-discovery
        documentIndex: 2
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
        documentIndex: 2
